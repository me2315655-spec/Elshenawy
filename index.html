else{o.st='done';if(o.pay=='cod'||o.ch===1){var u=DB.users.find(x=>x.id==o.uid);if(u)u.pts=rn(u.pts+o.pt)}notify(o.uid,'✅ تم استلام الأوردر بنجاح')}await save();R()}

DB.products.forEach(p=>{var AU=['علبة','كرتونة','صفيحة','بالتة','كيس','كيلو','قطعة'],v2=p.v2||{},sel=v=>uo(AU).replace('<option>'+v+'</option>','<option selected>'+v+'</option>'),id=p.id;

if(t=='codes')h+='<h3>أكواد التحقق</h3>'+(DB.codes.length?DB.codes.map(x=>`<div class="card"><div class="row sp"><b>${x.t=='verify'?'تحقق حساب جديد':'نسيان كلمة المرور'}</b><small>${x.d}</small></div>📞 ${E(x.p)} · الكود: <b>${x.c}</b><div class="row" style="margin-top:8px"><a target="_blank" href="https://wa.me/2${E(x.p)}?text=${encodeURIComponent('كود Elshenawy Store الخاص بك: '+x.c)}"><button class="ok">إرسال على واتساب</button></a><button class="g" onclick="delCode(${x.id})">حذف</button></div></div>`).join(''):'<div class="card">لا توجد أكواد معلقة</div>');

if(t=='cfg')h+=`<div class="card"><h3>نظام النقاط</h3><div class="row"><div class="grow"><label>عدد النقاط</label><input id="c1" type="text" inputmode="decimal" value="${c.rate[0]}"></div><div class="grow"><label>تساوي (ج.م)</label><input id="c2" type="text" inputmode="decimal" value="${c.rate[1]}"></div></div></div><div class="card"><h3>التوصيل</h3><label>رسوم التوصيل (ج.م)</label><input id="cf" type="text" inputmode="decimal" value="${c.fee}"><label>التوصيل من</label>${tp('d1',c.dh[0])}<label>إلى</label>${tp('d2',c.dh[1])}</div><div class="card"><h3>مواعيد أكواد التحقق</h3><label>من</label>${tp('h1',c.ch[0])}<label>إلى</label>${tp('h2',c.ch[1])}<small>12 ص = منتصف الليل</small></div><div class="card"><h3>أرقام الإيداع</h3>${Object.keys(PAY).map(k=>`<label>${PAY[k][0]}</label><input id="n_${k}" value="${E(c.pay[k])}">`).join('')}</div><button style="width:100%" onclick="saveCfg()">حفظ</button>`;

function custList(){var q=dg(S.q||'').trim().toLowerCase(),L=DB.users.filter(u=>!q||String(u.phone).includes(q)||(u.name||'').toLowerCase().includes(q));
return L.length?L.map(u=>`<div class="card"><div class="row sp"><b>${E(u.name)}</b><small>${E(u.phone)}</small></div>الرصيد: <b>${u.bal.toFixed(2)}</b> ج.م · النقاط: ${u.pts}<div class="row"><input id="b${u.id}" type="text" inputmode="decimal" placeholder="المبلغ" class="grow"><button class="ok" onclick="addB('${u.id}',1)">إضافة</button><button class="no" onclick="addB('${u.id}',-1)">خصم</button></div><small>${u.type=='m'?'🏪 تاجر':'🛒 زبون'}<br>📍 ${adt(u.addr)}</small><small>${E(u.email||'')}</small><div class="row"><button class="g grow" onclick="sendRst('${E(u.email||'')}')">📧 إرسال رابط تغيير كلمة المرور</button></div></div>`).join(''):'<div class="card">لا يوجد عملاء مطابقون</div>'}
function cl(){$('cl').innerHTML=custList()}
function sendRst(em){if(!em)return toast('لا يوجد بريد لهذا العميل');sendReset(em).then(()=>toast('تم إرسال رابط تغيير كلمة المرور إلى العميل')).catch(()=>toast('تعذر الإرسال'))}
var swBusy=0;
async function adminSweep(){if(SESS!='admin'||swBusy||!DB)return;swBusy=1;try{var ch=0,c=DB.cfg;
DB.products.forEach(p=>{if(p.per&&p.pcs==null){p.pcs=pcsOf(p);ch=1}});
DB.orders.forEach(o=>{
if(o.st=='cancel'&&!o.rs){cancelO(o);ch=1;return}
if(o.ch===0&&o.st!='cancel'){var sub=0,cst=0,pts=0,bad=0;(o.its||[]).forEach(i=>{var x=vr(i.id);if(!x){bad=1;return}sub+=x.pr*i.q;cst+=x.c*i.q;pts+=x.pt*i.q});
if(bad){cancelO(o);ch=1;return}
var tot=sub+((o.pay=='cod'&&!o.pk)?c.fee:0),u=DB.users.find(x=>x.id==o.uid);
if(o.pay=='app'){if(!u||u.bal<tot){cancelO(o);notify(o.uid,'تم إلغاء الطلب لأن رصيدك غير كافٍ');ch=1;return}u.bal=rn(u.bal-tot)}
o.p=rn(tot);o.c=rn(cst);o.pt=rn(pts);o.ch=1;ch=1}});
DB.reqs.forEach(r=>{if(r.st!='pending')return;var u=DB.users.find(x=>x.id==r.uid),a=c.rate[0],b=c.rate[1];
if(!u||!(r.pts>=a)||u.pts<r.pts){r.st='no';if(u)notify(u.id,'تعذر تحويل النقاط (رصيد النقاط غير كافٍ)');ch=1;return}
var n=Math.floor(r.pts/a);u.pts=rn(u.pts-n*a);u.bal=rn(u.bal+n*b);r.st='done';notify(u.id,'تم تحويل '+n*a+' نقطة إلى '+n*b+' ج.م في رصيدك');ch=1});
if(ch)await save()}finally{swBusy=0}}
async function decide(id,ok){await pull();var d=DB.deposits.find(x=>x.id==id);if(!d||d.st!='pending')return;var u=DB.users.find(x=>x.id==d.uid);
if(!u){d.st='no';await save();return R()}
d.st=ok?'ok':'no';if(ok){u.bal=rn(u.bal+d.a);notify(u.id,'تمت إضافة مبلغ '+d.a+' ج.م إلى رصيدك ✅')}else notify(u.id,'تم رفض طلب إيداع '+d.a+' ج.م، تواصل مع خدمة العملاء');await save();R()}

f?img(f,go2,400):go2('')}

async function saveCfg(){var n=i=>fl(i),a=n('c1'),b=n('c2'),f=n('cf'),d1=rdT('d1'),d2=rdT('d2'),h1=rdT('h1'),h2=rdT('h2');
if(!(a>0))return toast('اكتب عدد النقاط');if(!(b>0))return toast('اكتب قيمة النقاط بالجنيه');if(isNaN(f)||f<0)return toast('اكتب رسوم التوصيل');
await pull();var c=DB.cfg;c.rate=[a,b];c.fee=f;c.dh=[d1,d2];c.ch=[h1,h2];Object.keys(PAY).forEach(k=>{if(V('n_'+k))c.pay[k]=V('n_'+k)});await save();toast('تم حفظ الإعدادات ✅')}

function wMd(m){var s=mst(m),sc={pending:'معلق',paid:'تم التحصيل',bounced:'مرتد'};
return`<button class="g" onclick="S.mid=0;R()">← التجار</button><div class="card" style="margin-top:10px"><h3>🏪 ${E(m.name)}</h3><small>${E(m.phone||'')}</small><div class="row"><div class="card stat"><b>${m2(s.buy)}</b>اشترى بـ</div><div class="card stat"><b>${m2(s.pr)}</b>كسبنا منه</div><div class="card stat"><b>${m2(s.rem)}</b>المتبقي عليه</div></div><div>شيكات معلقة: <b>${s.pn}</b> بمبلغ <b>${m2(s.pa)}</b> ج.م</div></div><div class="card"><h3>إضافة شيك</h3><div class="row"><div class="grow"><label>المبلغ</label><input id="cha" type="text" inputmode="decimal"></div><div class="grow"><label>تاريخ الاستحقاق</label><input id="chd" type="date"></div></div><label>رقم الشيك (اختياري)</label><input id="chn" type="text" inputmode="text"><button style="width:100%" onclick="addChq('${m.id}')">إضافة الشيك</button></div><h3>الشيكات</h3>`+(s.C.length?s.C.map(c=>`<div class="card"><div class="row sp"><b>${m2(c.amt)} ج.م</b><span class="tag ${c.st=='paid'?'done':c.st=='bounced'?'rej':'pend'}">${sc[c.st]}</span></div><small>استحقاق: ${E(c.due||'-')} ${c.no?'· رقم '+E(c.no):''}</small>${c.st=='pending'?`<div class="row" style="margin-top:8px"><button class="ok grow" onclick="chqSt(${c.id},'paid')">تم التحصيل</button><button class="no grow" onclick="chqSt(${c.id},'bounced')">مرتد</button></div>`:''}<button class="g" style="margin-top:6px" onclick="ask('حذف الشيك؟','chqDel(${c.id})')">حذف</button></div>`).join(''):'<div class="card">لا توجد شيكات</div>')+'<h3>الفواتير</h3>'+(s.I.length?s.I.map(i=>`<div class="card" onclick="invShow(${i.id})" style="cursor:pointer"><div class="row sp"><b>#${i.no}</b><b>${m2(i.total)} ج.م</b></div><small>${E(i.d)}${i.paid!=null&&i.paid<i.total?' · متبقي '+m2(i.total-i.paid):''}</small></div>`).join(''):'<div class="card">لا توجد فواتير</div>')}
async function addM(){var n=V('mn1');if(!n)return toast('اكتب اسم التاجر');await pull();DB.merch.push({id:nid(),name:n,phone:V('mn2')});await save();toast('تمت الإضافة ✅');R()}
async function addChq(mid){var a=fl('cha');if(!(a>0))return toast('اكتب مبلغ الشيك');await pull();DB.chq.unshift({id:nid(),mid:mid,amt:a,due:V('chd'),no:V('chn'),st:'pending',d:now()});await save();toast('تمت إضافة الشيك ✅');R()}
async function chqSt(id,st){await pull();var c=DB.chq.find(x=>x.id==id);if(c)c.st=st;await save();R()}
async function chqDel(id){await pull();DB.chq=DB.chq.filter(x=>x.id!=id);await save();R()}
function wAl(al){return`<div class="card"><h3>إعدادات التنبيه</h3><label>التنبيه قبل انتهاء الصلاحية بـ (يوم)</label><input id="exd" type="text" inputmode="decimal" value="${DB.cfg.exd||30}"><button style="width:100%" onclick="saveExd()">حفظ</button><small>ويتم التنبيه بالكمية من خانة "تنبيه عند أقل من" في كل منتج. الإشعارات تصل لهاتف المدير.</small></div>`+(al.length?al.map(a=>`<div class="card">${E(a.t)}</div>`).join(''):'<div class="card">✅ لا توجد تنبيهات</div>')}
async function saveExd(){var d=fl('exd');if(!(d>=0))return toast('اكتب عدد أيام صحيح');await pull();DB.cfg.exd=d;await save();toast('تم الحفظ ✅');R()}

var lastSw=0;
async function sweep(){if(SESS!='admin'||!FB||Date.now()-lastSw<60000)return;lastSw=Date.now();var sent={};DB.alsent.forEach(x=>{sent[x.k]=1});var nw=alerts().filter(a=>!sent[a.k]);if(!nw.length)return;nw.forEach(a=>{DB.alsent.push({id:nid(),k:a.k});ntf('⚠️ تنبيه مخزن',a.t)});await save()}
async function whDel(id){await pull();DB.products=DB.products.filter(x=>x.id!=id);await save();toast('تم حذف المنتج');R()}
async function whClean(){await pull();DB.products=DB.products.filter(x=>x.id>12);await save();toast('تم حذف المنتجات التجريبية');R()}
function wRet(){S.rs=S.rs||{items:[]};var R2=DB.rsales.slice(0,15);
return`<div class="card"><h3>البيع القطاعي (بدون فاتورة)</h3><input id="rs3" type="text" inputmode="text" placeholder="🔍 ابحث عن منتج (أو اتركه فارغاً لعرض المنتجات)" oninput="rsr()"><div id="rsr">${rsrHtml()}</div><div id="rsl">${rslHtml()}</div></div><h3>آخر مبيعات القطاعي</h3>`+(R2.length?R2.map(r=>`<div class="card"><div class="row sp"><b>${m2(r.total)} ج.م</b><small>${E(r.d)}</small></div><small>${r.items.map(i=>E(i.n)+' ×'+i.q).join('، ')} · مكسب ${m2(r.total-r.cost)}</small><br><button class="g" style="margin-top:6px" onclick="ask('إلغاء عملية البيع وإرجاع الكميات؟','rsDel(${r.id})')">إلغاء</button></div>`).join(''):'<div class="card">لا توجد مبيعات بعد</div>')}
function rsrHtml(){var q=($('rs3')?V('rs3'):'').toLowerCase(),L=DB.products.filter(p=>!q||p.n.toLowerCase().includes(q)).slice(0,q?12:20);
return L.map(p=>`<div class="card"><div class="row sp"><b>${pic(p,28)} ${E(p.n)}</b><span class="row"><button class="g" onclick="rsAdd('${p.id}')">${E(p.u||'وحدة')} · ${p.p}</button>${p.v2?`<button class="g" onclick="rsAdd('${p.id}b')">${E(p.v2.u)} · ${p.v2.p}</button>`:''}</span></div></div>`).join('')}
function rsr(){$('rsr').innerHTML=rsrHtml()}
function rsAdd(k){var x=vr(k);if(!x)return;var I=S.rs,l=I.items.find(y=>y.k==k);if(l)l.q++;else I.items.push({k:k,n:x.n,q:1,pr:x.pr});$('rsl').innerHTML=rslHtml()}
function rsDelL(i){S.rs.items.splice(i,1);$('rsl').innerHTML=rslHtml()}
function rslHtml(){var I=S.rs,t=0;I.items.forEach(l=>{t+=l.q*l.pr});
return I.items.map((l,i)=>`<div class="card"><b>${E(l.n)}</b><div class="row"><input type="text" inputmode="decimal" value="${l.q}" oninput="rsi(${i},'q',this.value)" style="width:70px"> × <input type="text" inputmode="decimal" value="${l.pr}" oninput="rsi(${i},'pr',this.value)" style="width:90px"> = <b id="rt${i}">${rn(l.q*l.pr)}</b><button class="no" onclick="rsDelL(${i})">✕</button></div></div>`).join('')+(I.items.length?`<div class="card hero"><div class="row sp"><b>الإجمالي</b><b id="rtot">${m2(t)} ج.م</b></div></div><button class="ok" style="width:100%" onclick="rsSave()">✔ تم البيع</button><small>تعديل السعر هنا يخص هذه العملية فقط ولا يغيّر سعر المنتج في المتجر.</small>`:'<small>اضغط على الوحدة لإضافتها للبيع</small>')}
function rsi(i,f,v){var l=S.rs.items[i];l[f]=parseFloat(dg(String(v)).replace(/[,،٫]/g,'.'))||0;var e=$('rt'+i);if(e)e.textContent=rn(l.q*l.pr);var t=0;S.rs.items.forEach(y=>{t+=y.q*y.pr});e=$('rtot');if(e)e.textContent=m2(t)+' ج.م'}
async function rsSave(){var I=S.rs;if(!I||!I.items.length)return;await pull();var tot=0,cst=0,its=[];
for(var i=0;i<I.items.length;i++){var l=I.items[i],x=vr(l.k);if(!x){await pull(1);return toast('منتج غير موجود: '+l.n)}
if(!(l.q>0)||!(l.pr>=0)){await pull(1);return toast('راجع الكمية والسعر: '+l.n)}
if(l.q>x.st){await pull(1);return toast('الكمية المتاحة من '+x.n+' هي '+x.st)}
vtake(x,l.q);tot+=l.q*l.pr;cst+=l.q*x.c;its.push({id:l.k,n:x.n,q:l.q,pr:l.pr,c:x.c})}
DB.rsales.unshift({id:nid(),ts:Date.now(),d:now(),items:its,total:rn(tot),cost:rn(cst)});S.rs={items:[]};await save();toast('تم البيع ✅ '+m2(tot)+' ج.م');R()}
async function rsDel(id){await pull();var v=DB.rsales.find(x=>x.id==id);if(!v)return;v.items.forEach(i=>{var x=vr(i.id);if(x)vgive(x,i.q)});DB.rsales=DB.rsales.filter(x=>x.id!=id);await save();toast('تم الإلغاء');R()}

async function wipe(u){await pull(1);u=DB.users.find(x=>x.id==u.id)||u;
DB.orders.forEach(o=>{if(o.uid==u.id){o.name='حساب محذوف';o.phone='';delete o.addr}});
DB.notifs=DB.notifs.filter(n=>n.uid!=u.id);DB.chat=DB.chat.filter(m=>m.uid!=u.id);
var im=[u.photo];DB.deposits.filter(d=>d.uid==u.id).forEach(d=>im.push(d.img));DB.deposits=DB.deposits.filter(d=>d.uid!=u.id);DB.users=DB.users.filter(x=>x.id!=u.id);
var ok=await save();
im.filter(Boolean).forEach(ref=>{if(FB)fu(imgPath(ref)+'.json',{method:'DELETE'}).catch(()=>{});else try{localStorage.removeItem('im_'+ref)}catch(e){}});
if(FB){if(u.phone)try{await fu('/lookup/'+u.phone+'.json',{method:'DELETE'})}catch(e){}await authDel()}
return ok}
function delAcc(){modal(`<h3>حذف الحساب</h3><p>سيتم حذف حسابك وبياناتك الشخصية نهائياً ولا يمكن التراجع.</p><label>اكتب كلمة المرور للتأكيد</label><input id="dpw" type="password"><div class="row"><button class="no grow" onclick="doDel()">حذف نهائي</button><button class="g grow" onclick="closeM()">إلغاء</button></div>`)}
async function doDel(){var u=me();if(!u)return;var pw=$('dpw').value;
if(FB){try{await authSign(u.email,pw)}catch(e){return toast('كلمة المرور غير صحيحة')}}else if(u.pw!=await H(pw))return toast('كلمة المرور غير صحيحة');
await wipe(u);closeM();try{localStorage.removeItem('es_pin')}catch(e){}sess(null);S.m=0;S.tab='home';toast('تم حذف حسابك نهائياً');R()}
async function doDelWeb(){var p=V('dp1'),w=$('dp2').value,u;
if(!FB){await pull();var h=await H(w);u=DB.users.find(x=>x.phone==p&&x.pw==h);if(!u)return toast('بيانات غير صحيحة');await wipe(u);if(SESS==u.id)sess(null);S.m='delok';return R()}
var em=p.indexOf('@')>0?p.toLowerCase():null;if(!em){if(!/^01\d{9}$/.test(p))return toast('اكتب رقم الهاتف أو البريد');try{em=await lookupEmail(p)}catch(e){return toast('تعذر الاتصال، تأكد من الإنترنت')}if(!em)return toast('بيانات غير صحيحة')}
var au;try{au=await authSign(em,w)}catch(e){return toast('بيانات غير صحيحة')}
SESS=au.uid;await pull(1);u=DB.users.find(x=>x.id==au.uid);if(!u){SESS=null;return toast('لا يوجد حساب بهذه البيانات')}
await wipe(u);SESS=null;sess(null);S.m='delok';R()}
function R(){var a=$('app');a.innerHTML=SESS=='admin'?admView():S.m?authView():custView();fillImgs();if(S.pd&&SESS!='admin')ptot();var c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight}
(async function(){loadCart();tokLoad();
try{var t0=localStorage.getItem('es_sess');if(t0){if(!FB)SESS=t0;else if(TOK&&(t0=='admin'||TOK.uid==t0)&&await tok())SESS=t0}}catch(e){}
await pull();
try{if(SESS&&SESS!='admin'){if(!DB.users.some(u=>u.id==SESS))SESS=null;else{var j=JSON.parse(localStorage.getItem('es_pin')||'null');if(j&&j.u==SESS)S.m='pin'}}}catch(e){}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{SWR=r}).catch(()=>{})}catch(e){}if(location.hash=='#delete-account')S.m='del';R();chkN();sweep();if(SESS=='admin')adminSweep();sched();setTimeout(()=>{var x=$('spl');if(x){x.style.opacity=0;setTimeout(()=>x.remove(),700)}},1300)})();
async function resume(){PQ=0;sched();await pull(1);chkN();sweep();if(SESS=='admin')adminSweep();var a=document.activeElement;if(!S.m&&!$('mdl')&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))R()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resume()});window.addEventListener('online',resume);
</script></body></html>
